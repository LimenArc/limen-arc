name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:          # trigger manually from the Actions tab at any time

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site + game to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'          # serves the whole repo; game lives at /android-game/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
