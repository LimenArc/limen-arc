name: Static checks

# Runs Python-only static checks on every push and PR. Pure stdlib —
# no external downloads, so no network failures. Verifies:
#   1. Every Remotes.Events.* referenced in code is declared in Remotes.lua
#   2. Every monster SpeciesId / item ItemId / reward Id resolves
#
# Luau syntax is verified by the author locally before push (luau-compile
# from the official release). If we ever want CI-side syntax checking back,
# add a separate job that pins to a specific Luau release and gracefully
# skips on network failure.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  consistency:
    name: Cross-file consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remote events declared vs used
        run: python3 scripts/check_remotes.py

      - name: Monster / item id references resolve
        run: python3 scripts/check_ids.py
