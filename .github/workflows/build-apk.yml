name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platforms;android-34 platform-tools'

      - name: Install npm dependencies
        working-directory: android-game
        run: npm install

      - name: Add Capacitor Android platform
        working-directory: android-game
        run: npx cap add android

      - name: Sync www/ assets to Android
        working-directory: android-game
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        working-directory: android-game/android
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android-game/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: android-game/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android-game/android/app/build/outputs/apk/debug/app-debug.apk \
             monster-realm-pal-quest.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: monster-realm-pal-quest
          path: monster-realm-pal-quest.apk
          retention-days: 90
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: apk-latest
          name: "Monster Realm: Pal Quest — Latest APK"
          body: |
            ## Install on Android

            1. Download **monster-realm-pal-quest.apk** from the Assets below
            2. On your phone: **Settings → Security → Install unknown apps** (enable it)
            3. Open the downloaded APK and tap **Install**

            ---

            🎮 **Play in browser:** https://limenarc.github.io/limen-arc/android-game/
          artifacts: monster-realm-pal-quest.apk
          allowUpdates: true
          removeArtifacts: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
