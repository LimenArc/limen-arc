name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['android-game/**']
  workflow_dispatch:

permissions:
  contents: write         # needed to create/update the release

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node ──────────────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Java ──────────────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Android SDK ───────────────────────────────────────────────────────────
      - name: Install Android build-tools 34
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "platform-tools" 2>/dev/null || true

      # ── npm ───────────────────────────────────────────────────────────────────
      - name: Install npm dependencies
        working-directory: android-game
        run: npm install

      # ── Capacitor ─────────────────────────────────────────────────────────────
      - name: Add Capacitor Android platform
        working-directory: android-game
        run: npx cap add android

      - name: Sync web assets to Android
        working-directory: android-game
        run: npx cap sync android

      # ── Gradle cache ──────────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android-game/android/**/*.gradle*', 'android-game/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: android-game/android
        run: ./gradlew assembleDebug --no-daemon

      # ── Upload artifact (30-day download in Actions tab) ──────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: monster-realm-pal-quest-debug
          path: android-game/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # ── Rename APK so the download filename is friendly ──────────────────────
      - name: Rename APK
        run: |
          cp android-game/android/app/build/outputs/apk/debug/app-debug.apk \
             monster-realm-pal-quest-debug.apk

      # ── Create / update "apk-latest" release with the APK attached ───────────
      - name: Release APK
        uses: ncipollo/release-action@v1
        with:
          tag: apk-latest
          name: "Monster Realm: Pal Quest — Latest APK"
          body: |
            **Install on Android:**
            1. Download `monster-realm-pal-quest-debug.apk` below
            2. On your phone: Settings → Security → enable "Install unknown apps"
            3. Open the APK and tap Install

            **Play in browser:** https://limenarc.github.io/limen-arc/android-game/
          artifacts: monster-realm-pal-quest-debug.apk
          allowUpdates: true
          removeArtifacts: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
