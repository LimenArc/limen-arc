name: Build APK

on:
  push:
    branches: ["**"]
    paths:
      - "android-terminal/**"
  pull_request:
    paths:
      - "android-terminal/**"
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java ────────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ── Android SDK ─────────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── Gradle cache ────────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android-terminal/**/*.gradle*', 'android-terminal/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android-terminal/gradlew

      - name: Generate Gradle wrapper jar
        working-directory: android-terminal
        run: gradle wrapper --gradle-version=8.7 --distribution-type=bin

      - name: Build debug APK
        working-directory: android-terminal
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── Upload artifact ─────────────────────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: limenarcterminal-debug
          path: android-terminal/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── Summary ─────────────────────────────────────────────────────────────
      - name: Print APK info
        run: |
          APK=android-terminal/app/build/outputs/apk/debug/app-debug.apk
          echo "### APK built successfully" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| File | \`$(basename $APK)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Size | $(du -sh $APK | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA256 | \`$(sha256sum $APK | cut -d' ' -f1)\` |" >> $GITHUB_STEP_SUMMARY

  # ── Release job (only on tags) ─────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: limenarcterminal-debug
          path: dist/

      - name: Rename APK with version tag
        run: mv dist/app-debug.apk dist/limenarcterminal-${{ github.ref_name }}-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/limenarcterminal-${{ github.ref_name }}-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
