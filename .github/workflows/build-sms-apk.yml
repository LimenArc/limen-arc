name: Build SMS Scheduler APK

on:
  push:
    branches: [main, claude/android-scheduled-sms-app-tRCdH]
    paths: ['sms-scheduler/**', '.github/workflows/build-sms-apk.yml']
  workflow_dispatch:

permissions:
  contents: write         # needed to create/update the release

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Java (AGP 8.5 requires JDK 17) ───────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Android SDK ──────────────────────────────────────────────────────────
      - name: Install Android build-tools 34
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "platform-tools" 2>/dev/null || true

      # ── Gradle cache ─────────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-sms-${{ hashFiles('sms-scheduler/**/*.gradle', 'sms-scheduler/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-sms-

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: sms-scheduler
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # ── Upload artifact (30-day download in the Actions tab) ─────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sms-scheduler-debug
          path: sms-scheduler/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # ── Rename APK so the download filename is friendly ──────────────────────
      - name: Rename APK
        run: cp sms-scheduler/app/build/outputs/apk/debug/app-debug.apk sms-scheduler-debug.apk

      # ── Create / update "sms-apk-latest" release with the APK attached ───────
      - name: Release APK
        uses: ncipollo/release-action@v1
        with:
          tag: sms-apk-latest
          name: "SMS Scheduler — Latest APK"
          body: |
            **Install on Android:**
            1. Download `sms-scheduler-debug.apk` below
            2. On your phone: Settings → Security → enable "Install unknown apps"
            3. Open the APK and tap Install
            4. Grant the **Send SMS**, **Notifications**, and **Alarms & reminders** permissions when asked

            The app sends a text from your own phone's SIM to any number you enter,
            at the date & time you pick.
          artifacts: sms-scheduler-debug.apk
          allowUpdates: true
          removeArtifacts: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
